# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
  # Crosses v2 (gggw). Built-in nRF52840, so these are boards, not a controller
  # board plus shield. The right half is the split central and carries the
  # config-app USB serial; see crosses-v2-zmk-firmware docs/adr/0001 for why the
  # studio-rpc-usb-uart snippet is deliberately absent.
  - board: crosses_v2_left
    artifact-name: crosses_v2_42_left

  - board: crosses_v2_right
    artifact-name: crosses_v2_42_right
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DDTS_EXTRA_CPPFLAGS="-DZMK_BEHAVIORS_KEEP_ALL"

  - board: crosses_v2_right
    shield: settings_reset
    artifact-name: crosses_v2_settings_reset
