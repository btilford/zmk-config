# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view
    artifact-name: corne_42_left
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view
    artifact-name: corne_42_right
  #- board: nice_nano
  #  shield: typeractive-corne_left nice_view_adapter nice_view
  #- board: nice_nano
  #  shield: typeractive-corne_right nice_view_adapter nice_view
  # nice!nano v2, despite the bootloader. Both halves ship an old UF2
  # bootloader (0.6.0, Jun 19 2021) that reports Board-ID nRF52840-nicenano
  # with no -v2 suffix -- serials C202D13AA14FC065 (right/central) and
  # 4C1739D148EC0A98 (left). That ID is wrong, and building nice_nano for it
  # inverts control-gpios on the P0.13 ext-power LDO, cutting power to
  # everything on the switched rail. Proven on hardware 2026-08-31: the v1
  # build gave `spi_nrfx_spim: Timeout` + `PMW3610 initialization failed in
  # step 0` and `i2c_nrfx_twi: Error on I2C line`, killing the trackball and
  # the OLED together; the v2 build ran PMW3610 init steps 0-3 clean with no
  # I2C error. Trust the peripherals, not the Board-ID.
  - board: nice_nano_v2
    shield: crosses_left
    artifact-name: crosses_42_left

  - board: nice_nano_v2
    shield: crosses_right
    artifact-name: crosses_42_right

  - board: corne_min_left
    artifact-name: corne_min_left
  - board: corne_min_right
    artifact-name: corne_min_right

  # Toucan2 (beekeeb). Left is the split central and carries the MIP display;
  # right carries the Azoteq TPS43 trackpad. rgbled_adapter drives the XIAO's
  # onboard RGB LED via caksoylar/zmk-rgbled-widget.
  - board: seeeduino_xiao_ble
    shield: toucan_left rgbled_adapter nice_view_gem
    artifact-name: toucan2_left

  - board: seeeduino_xiao_ble
    shield: toucan_right rgbled_adapter
    artifact-name: toucan2_right

  # Flash to clear paired-BLE state when the halves refuse to talk.
  - board: seeeduino_xiao_ble
    shield: settings_reset
    artifact-name: toucan2_settings_reset
