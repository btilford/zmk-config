manifest:
  defaults:
    remote: urob
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob
    - name: Good-Great-Grand-Wonderful
      url-base: https://github.com/Good-Great-Grand-Wonderful
    - name: efogdev
      url-base: https://github.com/efogdev
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: caksoylar
      url-base: https://github.com/caksoylar
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3.0
      import: app/west.yml
    - name: zmk-leader-key
      remote: urob
      path: modules/zmk/zmk-leader-key
    - name: zmk-helpers
      remote: urob
      path: modules/zmk/zmk-helpers
    - name: zmk-auto-layer
      remote: urob
      path: modules/zmk/zmk-auto-layer
    - name: zmk-adaptive-key
      remote: urob
      path: modules/zmk/zmk-adaptive-key
    - name: zmk-tri-state
      remote: urob
      path: modules/zmk/zmk-tri-state
    - name: zmk-unicode
      path: modules/zmk/unicode
    - name: gggw-zmk-keebs
      remote: Good-Great-Grand-Wonderful
      revision: zephyr-4.1
      path: modules/gggw-zmk-keebs
      # gggw's manifest carries two pmw3610 copies under names west cannot
      # dedupe against ours: zmk-pmw3610-driver-efog is the same repo and
      # revision as the efogdev driver, and -badjeff is a separate fork. All
      # three compiled at once, and their event listeners collided at link:
      #   multiple definition of `zmk_listener_zmk_pmw3610_idle_sleeper'
      # The crosses shield overlays instantiate "pixart,pmw3610-alt", which is
      # badjeff's binding, so badjeff is the copy that must survive. Both
      # efogdev copies are dropped -- gggw's here, ours below.
      import:
        file: config/west.yml
        name-blocklist:
          - zmk-pmw3610-driver-efog
    - name: zmk-report-rate-limit
      remote: efogdev
      revision: main
      path: modules/zmk/zmk-report-rate-limit
    - name: zmk-input-processor-xyz
      remote: badjeff
      revision: main
      path: modules/zmk/zmk-input-processor-xyz
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: main
      path: modules/zmk/zmk-rgbled-widget
  self:
     path: config