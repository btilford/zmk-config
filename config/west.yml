manifest:
  defaults:
    remote: urob
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob
    - name: Good-Great-Grand-Wonderful
      url-base: https://github.com/Good-Great-Grand-Wonderful
    - name: efogdev
      url-base: https://github.com/efogdev
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: beekeeb
      url-base: https://github.com/beekeeb
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3.0
      import: app/west.yml
    - name: zmk-leader-key
      remote: urob
      path: modules/zmk/zmk-leader-key
    - name: zmk-helpers
      remote: urob
      path: modules/zmk/zmk-helpers
    - name: zmk-auto-layer
      remote: urob
      path: modules/zmk/zmk-auto-layer
    - name: zmk-adaptive-key
      remote: urob
      path: modules/zmk/zmk-adaptive-key
    - name: zmk-tri-state
      remote: urob
      path: modules/zmk/zmk-tri-state
    - name: zmk-unicode
      path: modules/zmk/unicode
    # main, not zephyr-4.1. The zephyr-4.1 branch ships only a
    # boards/nice_nano.overlay for the crosses shield, and Zephyr applies a
    # shield's board overlay on an exact board-name match -- so a nice_nano_v2
    # build silently got no overlay, leaving i2c0 on the P0.17/P0.20 defaults.
    # Those are SPI SCK and the trackball's irq-gpios, so the OLED had no bus
    # and the trackball reported no motion. main carries
    # boards/nice_nano_v2.overlay with the P1.4/P1.6 I2C remap.
    #
    # main also declares a single pmw3610 driver rather than zephyr-4.1's two
    # extra copies, so the three-way link collision goes away without a
    # name-blocklist, and it uses compatible "pixart,pmw3610-efogtech" with the
    # newer trackball tuning -- which is what config/crosses_{left,right}.conf
    # were already written against.
    - name: gggw-zmk-keebs
      remote: Good-Great-Grand-Wonderful
      revision: main
      path: modules/gggw-zmk-keebs
      import: config/west.yml
    - name: zmk-report-rate-limit
      remote: efogdev
      revision: main
      path: modules/zmk/zmk-report-rate-limit
    - name: zmk-input-processor-xyz
      remote: badjeff
      revision: main
      path: modules/zmk/zmk-input-processor-xyz
    # Override gggw's floating `main` pin: rgbled-widget main now targets ZMK
    # newer than v0.3 (zmk_endpoint_get_selected API) and fails to compile.
    # Our own project entry takes precedence over the imported one.
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: v0.3
      path: modules/zmk/zmk-rgbled-widget
    # Corne Min (Mechboards): integrated nRF52840 boards corne_min_left/right.
    # Only the board branch — the corne-min-rgbled branch duplicates the
    # rgbled_adapter shield already provided by gggw's zmk-rgbled-widget import.
    - name: corne-min-board
      url: https://github.com/MechboardsLTD/zmk-module
      revision: corne-min
      path: modules/corne-min-board
    # Toucan2 (beekeeb): 42-key split, 2x seeeduino_xiao_ble, Azoteq TPS43
    # trackpad on the right half, memory-in-pixel display on the left.
    # The module sets `board_root: .` so it supplies the toucan_left /
    # toucan_right and nice_view_gem shields.
    - name: zmk-keyboard-toucan2
      remote: beekeeb
      revision: main
      path: modules/zmk/zmk-keyboard-toucan2
    # Azoteq TPS43 trackpad driver (CONFIG_INPUT_TPS43).
    - name: zmk_driver_azoteq
      remote: beekeeb
      revision: main
      path: modules/zmk/zmk_driver_azoteq
    # Pinch-to-zoom input processor used by toucan.dtsi's zip_zoom_mapper.
    - name: zmk-input-zoom
      remote: beekeeb
      revision: main
      path: modules/zmk/zmk-input-zoom
  self:
     path: config
