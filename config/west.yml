# Crosses v2 lives on ZMK `main` (Zephyr 4.x), not the v0.3.0 line the rest of
# this repo used. That is not a preference — the crosses_v2 boards and the
# PAW3222 trackball stack only exist against main. Since a west workspace
# resolves exactly one `zmk` revision, every target in build.yaml has to agree
# on it.
#
# ZMK and the urob modules are pinned to the exact SHAs urob's own zmk-config
# uses (main, 2026-08-18). Floating `main` on six interdependent modules is how
# this repo got into trouble before; these move only when we bump them.
#
# Crosses v1 deliberately is NOT built from this manifest, and cannot be — it is
# not a question of effort. Both keyboards pull a report-rate-limit module that
# claims `compatible: zmk,input-processor-report-rate-limit`, but they are
# incompatible forks of it:
#
#   v2  crosses_v2.dts uses `<&zip_report_rate_limit 2>`   -> badjeff's fork,
#       #input-processor-cells = <1>
#   v1  crosses_*.conf sets ZMK_..._REPORT_RATE_LIMIT_DEFAULT -> efogdev's fork,
#       #input-processor-cells = <0>, a Kconfig the other fork does not define
#
# West clones both (different project names), then the devicetree build refuses
# two bindings with one compatible, and neither fork can stand in for the other.
# So: crosses v1, corne and toucan2 stay on master's v0.3.0 manifest; this branch
# is crosses v2 only. Revisit if gggw converges the two upstreams.
manifest:
  defaults:
    remote: urob

  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob
    - name: Good-Great-Grand-Wonderful
      url-base: https://github.com/Good-Great-Grand-Wonderful

  projects:
    - name: zmk
      remote: zmkfirmware
      revision: 6e2ef41e022d555b10f116e395832913f71717b3 # main (2026-08-18)
      import: app/west.yml

    # urob's keymap-helper modules. base.keymap is written against these.
    - name: zmk-helpers
      path: modules/zmk/zmk-helpers
      revision: bc114546392b4615ac90a99140eaf21dde31209d # main (2026-08-18)
    - name: zmk-leader-key
      path: modules/zmk/zmk-leader-key
      revision: e894d9afa5164b7fff641db4194fc3d4d6e84bbb # main (2026-08-18)
    - name: zmk-auto-layer
      path: modules/zmk/zmk-auto-layer
      revision: 62c201934711369d50a28df12e1d055d05cb6460 # main (2026-08-18)
    - name: zmk-adaptive-key
      path: modules/zmk/zmk-adaptive-key
      revision: e5b335a7b1076cb122582f5a892b118b02a3be34 # main (2026-08-18)
    - name: zmk-tri-state
      path: modules/zmk/zmk-tri-state
      revision: 269b13eb3f5491292b627ac3892589af32de3e17 # main (2026-08-18)
    - name: zmk-unicode
      path: modules/zmk/unicode
      revision: a1e3d3eed54dea800b5342a251eb3b83eee3b5ec # main (2026-08-18)

    # Crosses v2: supplies the crosses_v2_left / crosses_v2_right *boards*
    # (built-in nRF52840 — no controller shield) and, via its own manifest, the
    # PAW3222 driver and gggw's trackball behaviours and input processors.
    - name: crosses-v2-zmk-firmware
      remote: Good-Great-Grand-Wonderful
      revision: main
      path: modules/gggw/crosses-v2-zmk-firmware
      import: config/west.yml

  self:
     path: config
