# Toucan2 (beekeeb) — 42-key split, seeeduino_xiao_ble x2.
#
# Shield-level defaults (pointing device, TPS43 driver, split roles, sleep
# timeouts, display style) live in the module at
# modules/zmk/zmk-keyboard-toucan2/boards/shields/toucan/{toucan_left,toucan_right}.conf
# and are applied automatically. Only user preferences belong here.

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Increase wireless range.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Eager debouncing, matching corne/crosses.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# base.keymap uses &mmv / &msc / &mkp on the MOUSE layers.
CONFIG_ZMK_POINTING=y

# The nice_view_gem shield draws its own status screen; the stock ZMK widgets
# would fight it for the display.
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_WIDGET_WPM_STATUS=n
