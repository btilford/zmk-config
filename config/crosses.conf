# Uncomment the following line to enable deep sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Uncomment the following line to increase the keyboard's wireless range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# CONFIG_ZMK_WPM=y  # Disabled to avoid conflicts with nice_view WPM widget
# Eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# Enable ZMK Studio for Realtime Keymap Updates
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_STUDIO_LOCKING=n

# Uncomment the following line to enable USB Logging (this increases power usage by a significant amount, turn it off when not in use)
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_PMW3610_LOG_LEVEL_DBG=y
# CONFIG_ZMK_USB=y
# CONFIG_SERIAL=y

CONFIG_WS2812_STRIP=n
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Mouse
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
#
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
#
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_ZMK_INPUT_PROCESSOR_TEMP_LAYER=y


# Display
# Both halves carry an SSD1306. Unlike the Corne's nice!view, which supplies its
# own ZMK_DISPLAY_STATUS_SCREEN_CUSTOM, the SSD1306 renders ZMK's built-in status
# screen -- and that screen is composed of the widgets below. Turning them all off
# leaves a powered but blank OLED, so they stay on here.
#
# MERGE ORDER, verified in CI 2026-08-31: the shield's own conf is merged AFTER
# this file, not before --
#   prj.conf -> config/crosses.conf -> config/crosses_left.conf
#            -> modules/gggw-zmk-keebs/boards/shields/crosses/crosses_left.conf
# so the shield wins every symbol it also sets, and this file only decides the
# ones it does not. That is why the earlier CONFIG_ZMK_DISPLAY=n here never took
# effect (the shield sets =y last, and builds predating the fix already resolved
# CONFIG_ZMK_DISPLAY=y / CONFIG_SSD1306=y): the blank OLED was the widgets below,
# which the shield leaves alone. Same reason config/crosses_left.conf's
# PMW3610_ALT_REPORT_INTERVAL_MIN=16 resolves to the shield's 0. Check the
# build log's "Merged configuration" lines before assuming a value here applies.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
# WPM needs CONFIG_ZMK_WPM=y to feed it, and the OLED is short on room; leave off.
CONFIG_ZMK_WIDGET_WPM_STATUS=n
#

# The leader behavior copies every sequence into a fixed global array with no
# bounds check and no build assert (behavior_leader_key.c). Default is 32;
# crossing it corrupts memory rather than failing the build. Headroom, not need.
CONFIG_ZMK_LEADER_MAX_SEQUENCES=48
