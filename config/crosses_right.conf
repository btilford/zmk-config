CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

CONFIG_PMW3610_ALT=y
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=0
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=1

# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_PMW3610_ALT_LOG_LEVEL_DBG=y
# CONFIG_ZMK_USB=y
# CONFIG_SERIAL=y
#
# Bump the power up
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Help Realtek and Intel chips a bit
CONFIG_BT_CTLR_PHY_2M=n
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# The leader behavior copies every sequence into a fixed global array with no
# bounds check and no build assert (behavior_leader_key.c). Default is 32;
# crossing it corrupts memory rather than failing the build. Headroom, not need.
CONFIG_ZMK_LEADER_MAX_SEQUENCES=48

# Dropped 2026-08-31 when the duplicate efogdev pmw3610 copies were removed from
# the manifest. The shield overlays instantiate "pixart,pmw3610-alt" (badjeff),
# which has no equivalent for these four, so they never took effect on this
# hardware -- they only tuned a driver that was linked but never instantiated:
#   CONFIG_PMW3610_IGNORE_FIRST_N / _IGNORE_AFTER_REST / _ANTI_WARP / _ANTI_WARP_THRES
