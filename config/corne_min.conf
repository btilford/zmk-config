# Corne Min (Mechboards) — integrated nRF52840, no display, no pointing device.
# Keymap is the same base.keymap as the corne.

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Eager debouncing, matching the other keyboards
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# base.keymap includes mouse.dtsi (emulated mouse keys)
CONFIG_ZMK_POINTING=y

# Onboard red/green/blue status LEDs (battery/connection/charge indication).
# Widget module comes in via gggw's zmk-rgbled-widget import.
CONFIG_RGBLED_WIDGET=y

# See base.keymap: the leader behavior has no bounds check on its sequence array.
CONFIG_ZMK_LEADER_MAX_SEQUENCES=48
