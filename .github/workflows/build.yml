name: Build ZMK firmware artifacts

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  archive-name:
    # `github.ref_name` is `<pr-number>/merge` on pull_request events and an
    # artifact name may not contain `/`, so uploading the merged artifact failed
    # on every PR while each firmware target built fine. Derive the name once
    # here and have both the build and the release job read it back, so the two
    # can never drift apart.
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.derive.outputs.name }}
    steps:
      - id: derive
        env:
          # On a PR use the source branch rather than the merge ref; on push
          # (branch or tag) ref_name is already the name we want.
          REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          echo "name=zmk-firmware-$(printf '%s' "$REF" | tr '/' '-')" >> "$GITHUB_OUTPUT"

  build:
    # This branch pins zmk main in config/west.yml -- the crosses_v2 boards and
    # the PAW3222 stack only exist there -- so CI has to match.
    needs: archive-name
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      archive_name: ${{ needs.archive-name.outputs.name }}

  release:
    # Archive a known-good build: `git tag v2026.08.28 && git push --tags`.
    runs-on: ubuntu-latest
    needs: [archive-name, build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.archive-name.outputs.name }}
          path: firmware

      - name: Normalise filenames and checksum
        run: |
          cd firmware
          ls -la
          # The upstream workflow names images after the whole shield string,
          # spaces included, which is awkward to pick off a release page.
          for f in *.uf2; do
            clean=$(printf '%s' "$f" | tr ' ' '_')
            [ "$f" = "$clean" ] || mv -- "$f" "$clean"
          done
          sha256sum *.uf2 > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          # Passed through the environment rather than interpolated into the
          # script, so the ref name is never treated as shell syntax.
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          Firmware built from this tag. Flash by double-tapping reset on a half
          and copying the matching `.uf2` onto the USB drive that appears.

          `SHA256SUMS` is included so an archived copy can be checked against
          what this tag actually produced.
          NOTES
          gh release create "$TAG" --title "$TAG" --notes-file notes.md \
            firmware/*.uf2 firmware/SHA256SUMS
